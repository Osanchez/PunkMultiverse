name: Build PunkMultiverse

# Every push to main builds the mod and publishes the zip as a GitHub Release.
# Proprietary reference DLLs are NOT in git; they come from the punkmultiverse-refs.zip asset on
# the 'refs' release of the private Osanchez/PunkMods-refs repo (same infrastructure as the Mods
# repo), pulled with a fine-grained PAT stored as the REFS_TOKEN secret.
# First-time setup: run tools/update-refs.ps1 locally once to create/refresh that asset, and add
# the REFS_TOKEN secret (read access to Osanchez/PunkMods-refs) to this repository.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'server_image/**'  # server image (Dockerfile/scripts) — not part of the mod DLL
      - 'infra/**'         # AWS setup scripts / Lambda source — not part of the mod DLL
      - 'tools/**'         # test harnesses / admin scripts — not part of the mod DLL
      - '.githooks/**'     # local git hooks — not part of the mod DLL
      - '.github/**'       # CI config itself — validate it with workflow_dispatch, not a release
      - '.claude/**'       # agent skills/config — not part of the mod DLL
      - 'gamescan/**'      # game-API hashes/contract data — read by tooling, never compiled.
                           # (The compiled-in copy is src/Core/GameBaseline.g.cs, which DOES build.)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The pin step below commits back to main, which needs the credentials kept.
        with:
          persist-credentials: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download reference DLLs (private PunkMods-refs release asset)
        env:
          GH_TOKEN: ${{ secrets.REFS_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) { throw "REFS_TOKEN secret is not set. Create a fine-grained PAT with read access to Osanchez/PunkMods-refs and add it as the REFS_TOKEN secret." }
          New-Item -ItemType Directory -Force -Path gamedir | Out-Null
          gh release download refs --repo Osanchez/PunkMods-refs --pattern punkmultiverse-refs.zip --dir . --clobber
          Expand-Archive -Path punkmultiverse-refs.zip -DestinationPath gamedir -Force

      - name: Build & package
        shell: pwsh
        run: ./build.ps1 -GameDir "$PWD/gamedir" -Zip

      - name: Compute version tag
        id: ver
        shell: pwsh
        run: |
          # Tag releases with the mod version itself (the pre-commit hook bumps it every
          # buildable commit, so tags stay unique) — matches the zip name and the handshake.
          $version = (Select-Xml -Path PunkMultiverse.csproj -XPath '//Version' | Select-Object -First 1).Node.InnerText
          if (-not $version) { throw "Could not read <Version> from PunkMultiverse.csproj" }
          $tag = "v$version"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PunkMultiverse ${{ steps.ver.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true

      - name: Setup Python
        if: "${{ !contains(github.event.head_commit.message, 'ci: pin download') }}"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Checksums must be a POST-BUILD step: the thing hashed is the artifact this run just
      # published. PUNK Nexus refuses an install whose bytes do not match, so this is what makes a
      # zip swapped at the download url afterwards get rejected instead of installed.
      #
      # TWO GUARDS AGAINST AN ENDLESS RELEASE LOOP, because this commit lands on main and main is
      # what triggers this workflow:
      #
      #   1. [skip ci] in the commit message, which stops the push creating a run at all.
      #   2. The `if:` above and below, which skips this step when the run WAS triggered by that
      #      commit. Idempotence alone cannot be guard 2 here: a rebuild produces different bytes
      #      (Compress-Archive stamps timestamps) under the same version tag, so "nothing changed"
      #      is never true and a loop would run forever writing new hashes.
      #
      # Guard 1 is the one that normally fires; guard 2 is there because it does not depend on
      # GitHub honoring a magic string in a commit message.
      - name: Pin download and checksum to this release
        if: "${{ !contains(github.event.head_commit.message, 'ci: pin download') }}"
        shell: pwsh
        run: |
          python tools/pin-download.py --dist dist --tag '${{ steps.ver.outputs.tag }}'
          if ($LASTEXITCODE -ne 0) { throw "pin-download failed." }

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add mod.json
          if (git diff --cached --quiet) {
            Write-Host 'mod.json already pinned to this release; nothing to commit.'
            exit 0
          }
          # --no-verify is REQUIRED, not tidiness. build.ps1 ran above, and its line 21 sets
          # core.hooksPath to .githooks in whatever clone it finds -- including this runner's. So
          # without it the pre-commit hook fires here and bumps the version a second time, leaving
          # mod.json advertising a release that was never built: the client then downloads the real
          # artifact, reads the older number out of the packaged mod.json, and flags every install
          # as an unverified version mismatch. Cost one wasted version (0.1.254) to find out.
          git commit --no-verify -m 'ci: pin download to ${{ steps.ver.outputs.tag }} [skip ci]'

          # Fail loudly if the commit carried anything beyond the two pinned fields. The bug above
          # was silent precisely because the push succeeded -- the damage only appeared later, in a
          # client dialog, on a machine nobody was watching.
          $committed = (git show --pretty=format: --name-only HEAD | Where-Object { $_ }) -join ','
          if ($committed -ne 'mod.json') { throw "pin commit touched '$committed', expected mod.json alone." }
          $pinned = (Get-Content mod.json -Raw | ConvertFrom-Json).version
          if ("v$pinned" -ne '${{ steps.ver.outputs.tag }}') {
            throw "mod.json version '$pinned' no longer matches the released tag ${{ steps.ver.outputs.tag }}."
          }

          # Rebase-and-retry rather than a bare push. This step runs minutes after the checkout, so
          # main can easily have moved on -- and when it has, a plain `git push HEAD:main` is
          # rejected and the checksum for a release that IS ALREADY PUBLISHED never lands. That is
          # not a harmless CI failure: the manifest keeps pointing at the previous release, and if
          # that release's asset was rebuilt the declared hash no longer matches it, so the client
          # refuses to install the mod at all until someone notices.
          $pushed = $false
          foreach ($attempt in 1..3) {
            git push origin HEAD:main 2>&1 | Write-Host
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }

            Write-Host "push rejected (attempt $attempt); rebasing onto the current main"
            git fetch origin main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) { git rebase --abort; throw "could not rebase the pin commit onto main." }
          }
          if (-not $pushed) { throw "could not push the pin commit after 3 attempts." }
